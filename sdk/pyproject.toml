[project]
name = "swarmtrace"
version = "0.1.0"
description = "Instrumentation SDK for SwarmTrace — multi-agent observability & time-travel debugging"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Leo", email = "codewithleo@example.com" }]
requires-python = ">=3.10"
keywords = ["ai", "agents", "observability", "opentelemetry", "llm", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.urls]
Homepage    = "https://github.com/codewithleo1/SwarmTrace"
Repository  = "https://github.com/codewithleo1/SwarmTrace"
Issues      = "https://github.com/codewithleo1/SwarmTrace/issues"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarmtrace"]

[tool.ruff]
line-length = 100
target-version = "py310"